          - Jetson Orin NX: knowledge-base/01_Hardware/jetson_orin_nx.md
          - Carte Rosmaster X3: knowledge-base/01_Hardware/rosmaster_x3_mcu.md
          - Caméra Astra Pro+: knowledge-base/01_Hardware/orbbec_astra_pro_plus.md
