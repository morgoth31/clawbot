# Registre des skills (référentiel §7, bornes validées par l'opérateur le 2026-11-22).
#
# Le schéma JSON et les bornes vivent ici : le serveur refuse un goal hors schéma
# (INVALID_PARAMS) et la boucle de déplacement sature à `bornes`, quoi que demande
# l'appelant. Limites du pilote pour comparaison : xlinear_limit 1,0 m/s,
# ylinear_limit 1,0 m/s, angular_limit 5,0 rad/s — les bornes ci-dessous sont 5× et
# 6× plus basses.

skills:
  stop:
    description: "Arrête immédiatement le robot : consigne nulle sur /cmd_vel/skill."
    params_schema: {type: object, additionalProperties: false, properties: {}}
    requires: []
    timeout_s: 2.0

  wait:
    description: "Attend un nombre de secondes borné (utile pour synchroniser)."
    params_schema:
      type: object
      additionalProperties: false
      required: [seconds]
      properties:
        seconds: {type: number, exclusiveMinimum: 0, maximum: 30}
    requires: []
    timeout_s: 31.0

  move_relative:
    description: >
      Avance d'une distance relative en ligne droite (dx, dy en mètres du repère
      robot), sans réorientation.
    params_schema:
      type: object
      additionalProperties: false
      required: [dx_m]
      properties:
        dx_m: {type: number, minimum: -2.0, maximum: 2.0}
        dy_m: {type: number, minimum: -2.0, maximum: 2.0, default: 0.0}
        max_speed_mps: {type: number, exclusiveMinimum: 0, maximum: 0.2, default: 0.2}
    requires: [base, lidar]
    timeout_s: 30.0
    bornes: {max_speed_mps: 0.2, max_distance_m: 2.0}

  rotate:
    description: "Tourne sur place d'un angle relatif en radians (sens trigonométrique positif)."
    params_schema:
      type: object
      additionalProperties: false
      required: [angle_rad]
      properties:
        angle_rad: {type: number, minimum: -6.283185307179586, maximum: 6.283185307179586}
        max_speed_rps: {type: number, exclusiveMinimum: 0, maximum: 0.8, default: 0.8}
    requires: [base, lidar]
    timeout_s: 20.0
    bornes: {max_speed_rps: 0.8, max_angle_rad: 6.283185307179586}

  capture_image:
    description: "Enregistre une image de la caméra demandée (poignet ou Astra) en JPEG."
    params_schema:
      type: object
      additionalProperties: false
      required: [camera]
      properties:
        camera: {type: string, enum: [wrist, astra]}
    # La capacité exigée dépend de la caméra : l'Astra n'a pas besoin de la caméra
    # du poignet (REQ-PERC-005).
    requires: []
    requires_by_param:
      camera:
        wrist: [wrist_vision]
        astra: [depth_vision]
    timeout_s: 5.0

  navigate_to:
    description: "Va à une pose du plan (x, y, yaw) — refusé tant que la capacité navigation n'est pas servie."
    params_schema:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: {type: number}
        y: {type: number}
        yaw: {type: number, default: 0.0}
        frame: {const: map}
    requires: [navigation]
    timeout_s: 120.0

  save_map:
    description: "Enregistre la carte courante sous un nom — refusé tant que la capacité mapping n'est pas servie."
    params_schema:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, pattern: "^[a-z0-9_-]{1,32}$"}
    requires: [mapping]
    timeout_s: 20.0

  detect_objects:
    description: >
      Attend la prochaine détection d'objets et renvoie les boîtes filtrées par classes.
      La capacité `detection` doit être active : le skill ne l'active pas lui-même.
    params_schema:
      type: object
      additionalProperties: false
      required: [camera]
      properties:
        camera: {type: string, enum: [wrist, astra], default: wrist}
        classes:
          type: array
          items: {type: string}
          maxItems: 20
        timeout_s: {type: number, exclusiveMinimum: 0, maximum: 10.0, default: 3.0}
    requires: [detection]
    timeout_s: 12.0

  # ── bras (P13) ────────────────────────────────────────────────────────────
  # Les poses commandées viennent de `config/arm_poses.yaml` : liste blanche validée
  # par l'opérateur, jamais un angle libre. La conversion servo -> radians est celle du
  # contrôleur ; la vérification finale se fait sur `/arm/servo_angles`.

  arm_rest:
    description: >
      Ramène le bras dans l'enveloppe de repos validée (C10) : trajectoire vers la pose
      `repos`, puis vérification sur les angles relus par le pilote.
    params_schema: {type: object, additionalProperties: false, properties: {}}
    requires: [arm]
    timeout_s: 20.0
    bornes: {duree_s: 3.0, verification_timeout_s: 5.0}

  arm_named_pose:
    description: >
      Exécute une pose nommée de la liste validée ; une pose inconnue est refusée
      INVALID_PARAMS sans envoyer de trajectoire.
    params_schema:
      type: object
      additionalProperties: false
      required: [pose]
      properties:
        pose: {type: string, minLength: 1, maxLength: 32}
        duration_s: {type: number, minimum: 1.0, maximum: 10.0}
    requires: [arm]
    timeout_s: 25.0
    bornes: {duree_s: 3.0, verification_timeout_s: 5.0}

  gripper:
    description: "Ouvre ou ferme la pince (butées du SRDF, servo 6)."
    params_schema:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: {type: string, enum: [open, close]}
    requires: [arm]
    timeout_s: 10.0
    bornes: {duree_s: 1.5, verification_timeout_s: 3.0}
