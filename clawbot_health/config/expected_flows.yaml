# Flux attendus et seuils (référentiel §8). Cadences C12 à −10 %.
# `type` est le type ROS réel du topic : le moniteur s'y abonne en brut (raw=True),
# mais DDS n'apparie que des types identiques — un abonnement String sur /scan ne
# reçoit jamais rien (constaté au premier démarrage en production).
# Un flux n'est surveillé que si sa capacité est active
# (paramètre assume_active_capabilities tant que P07 n'existe pas).

flows:
  - {topic: /scan,                     type: sensor_msgs/msg/LaserScan,      min_hz: 9.0,  max_age_s: 1.0, capability: lidar,        critical: true}
  - {topic: /odom,                     type: nav_msgs/msg/Odometry,          min_hz: 8.0,  max_age_s: 1.0, capability: base,         critical: true}
  - {topic: /imu/data_raw,             type: sensor_msgs/msg/Imu,            min_hz: 9.0,  max_age_s: 1.0, capability: base,         critical: true}
  - {topic: /voltage,                  type: std_msgs/msg/Float32,           min_hz: 9.0,  max_age_s: 2.0, capability: base,         critical: true}
  - {topic: /arm/servo_angles,         type: std_msgs/msg/Int32MultiArray,   min_hz: 9.0,  max_age_s: 2.0, capability: base,         critical: false}
  - {topic: /cmd_vel_safe,             type: geometry_msgs/msg/Twist,        min_hz: 18.0, max_age_s: 0.5, capability: base,         critical: true}
  - {topic: /wrist_camera/image_raw,   type: sensor_msgs/msg/Image,          min_hz: 25.0, max_age_s: 1.0, capability: wrist_vision, critical: false}
  # Couleur Astra : 30 fps demandés au lancement, 20,1 Hz mesurés sur USB 2.0 (P11).
  # Seuil = mesure − 10 % (C12), et non les 25 Hz du mode théorique.
  - {topic: /camera/color/image_raw,   type: sensor_msgs/msg/Image,          min_hz: 18.0, max_age_s: 1.0, capability: depth_vision, critical: false}
  - {topic: /camera/depth/image_raw,   type: sensor_msgs/msg/Image,          min_hz: 10.0, max_age_s: 1.0, capability: depth_vision, critical: false}
  # /perception/detections porte désormais un vision_msgs/Detection2DArray (P12) :
  # l'ancien type String appartenait à /detections, gardé pour hardware_service.
  - {topic: /perception/detections,    type: vision_msgs/msg/Detection2DArray, min_hz: 2.0, max_age_s: 2.0, capability: detection,    critical: false}
