[pytest]
minversion = 8.0
pythonpath = ../..
testpaths = .
asyncio_mode = auto

addopts = -q --strict-markers --timeout=60

markers =
    unit: logique pure, sans ROS ni réseau
    contract: contrat MCP (JSON-RPC, schémas, authentification)
    ros: intégration ROS 2, domaine 99
    degraded: intervention du Système 2 via MCP
    safety: invariants de sûreté
    hardware: matériel réel, exclu par défaut
    slow: exécution longue

filterwarnings =
    ignore::DeprecationWarning
