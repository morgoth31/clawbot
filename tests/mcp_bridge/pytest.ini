[pytest]
minversion = 8.0
pythonpath = ../..
testpaths = .
asyncio_mode = auto

; `launch_testing` et `launch_ros` (ROS 2 Humble) déclarent des hooks pytest
; supprimés depuis pytest 8, ce qui interrompt toute exécution dans un shell
; où /opt/ros/humble/setup.bash est chargé. Exclus explicitement : ce sont
; des plugins de test de launch, sans rapport avec cette suite.
addopts = -q --strict-markers --timeout=60 -p no:launch_testing -p no:launch_ros

markers =
    unit: logique pure, sans ROS ni réseau
    contract: contrat MCP (JSON-RPC, schémas, authentification)
    ros: intégration ROS 2, domaine 99
    degraded: intervention du Système 2 via MCP
    safety: invariants de sûreté
    hardware: matériel réel, exclu par défaut
    slow: exécution longue

filterwarnings =
    ignore::DeprecationWarning
