# Execution des trajectoires : MoveIt n'a pas de ros2_control ici, il parle directement
# aux serveurs d'action FollowJointTrajectory de clawbot_arm_controller.
moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - grip_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5

  grip_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - grip_joint
