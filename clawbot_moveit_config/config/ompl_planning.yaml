# Planificateurs OMPL par groupe. RRTConnect par defaut : rapide et suffisant pour un
# bras 5 axes en espace libre. RRTstar en second choix quand la longueur du chemin
# compte.
#
# request_adapters est une chaine (et non une liste) : c'est le format attendu par
# move_group. AddTimeOptimalParameterization est indispensable -- sans lui, tous les
# points de la trajectoire portent time_from_start = 0.
planning_plugin: ompl_interface/OMPLPlanner
start_state_max_bounds_error: 0.1
jiggle_fraction: 0.05
request_adapters: >-
  default_planner_request_adapters/AddTimeOptimalParameterization
  default_planner_request_adapters/ResolveConstraintFrames
  default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds
  default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints

planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
  RRTstar:
    type: geometric::RRTstar
    range: 0.0
    goal_bias: 0.05
  PRM:
    type: geometric::PRM
    max_nearest_neighbors: 10

arm:
  default_planner_config: RRTConnect
  planner_configs:
    - RRTConnect
    - RRTstar
  projection_evaluator: joints(arm_joint1,arm_joint2)
  longest_valid_segment_fraction: 0.01

gripper:
  default_planner_config: RRTConnect
  planner_configs:
    - RRTConnect
  longest_valid_segment_fraction: 0.01
