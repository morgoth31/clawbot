# Exigences d'exploitation — mesures, unités systemd, arrêts propres, disque.
# Format et règles : requirements/README.md

domain: OPS
requirements:
  - id: REQ-OPS-001
    title: Mesures complémentaires consignées avec commande et artefact
    statement: >
      Les mesures M01 à M12 doivent être consignées avec commande, horodatage et
      artefact.
    rationale: >
      Quatre conclusions de l'audit du 2026-11-22 (trafic image par le Wi-Fi,
      absence de mémoire partagée, arrêt du pilote sur silence, propriétaire du
      port série) ne reposaient pas sur une mesure directe et changeaient la
      suite des travaux (P03, P10, P11, P13, P16).
    sources: [S07, S12, S13, S15, P01]
    safety: false
    method: inspection
    level: unit
    criterion: >
      docs/audit/2026-11-22-complements/rapport.md contient, pour chaque mesure
      M01 à M12, la commande exacte, l'horodatage ISO 8601, le résultat et la
      conclusion ; chaque sortie brute existe dans raw/Mxx_<nom>.txt et commence
      par une date ISO. Une mesure non réalisable porte la mention NON MESURÉ et
      sa raison.
    evidence: docs/audit/2026-11-22-complements/rapport.md
    status: implemented
    approved_by: null
    prompt: P01

  - id: REQ-OPS-010
    title: Politique de redémarrage et d'arrêt normalisée sur toutes les unités
    statement: >
      Chaque unité du robot doit déclarer Restart=on-failure, RestartSec=2,
      StartLimitIntervalSec=60, StartLimitBurst=5 et TimeoutStopSec=10.
    rationale: >
      RestartSec était absent ou très court sur plusieurs unités (100 ms par
      défaut), et Restart=always relançait un arrêt volontaire (R11, S25).
    sources: [R11, S25, S26]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_politique_de_redemarrage_normalisee, paramétré sur
      les 16 unités du robot (14 liées et actives, plus clawbot-description et
      yahboom_oled dont /etc porte encore une copie), sort vert : les cinq clés
      ont exactement la valeur exigée.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-011
    title: Sortie en code 0 sur SIGINT et SIGTERM pour les nœuds maison
    statement: >
      Un nœud maison (director, safety_arbitrator, sentinel, hardware_service)
      qui reçoit SIGINT ou SIGTERM doit sortir en code 0.
    rationale: >
      Un arrêt normal de la sentinelle levait ExternalShutdownException et
      laissait l'unité en failed (R05, S19) ; le directeur et l'arbitre ne
      rattrapaient que KeyboardInterrupt.
    sources: [R05, S19, R11]
    safety: false
    method: test
    level: unit
    criterion: >
      Un test par nœud remplace rclpy.spin (ou uvicorn.run) par une fonction qui
      lève KeyboardInterrupt puis ExternalShutdownException/SystemExit, et vérifie
      que main() renvoie 0. Quatre fichiers de test, deux cas chacun.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-012
    title: Serveur de documentation non exposé au réseau
    statement: >
      Le serveur de documentation ne doit écouter que sur 127.0.0.1.
    rationale: >
      clawbot-docs servait mkdocs sur 0.0.0.0:8080 sans authentification (R16).
    sources: [R16, S25]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_documentation_ecoute_en_local : l'ExecStart de
      clawbot-docs.service contient 127.0.0.1:8080 et ne contient plus 0.0.0.0.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-013
    title: Aucune commande de masse dans les unités
    statement: >
      Aucune commande d'unité ne doit contenir pkill, killall ou pgrep -f.
    rationale: >
      Le contrôle de processus passe par systemd uniquement, sur liste blanche ;
      une unité qui tue par motif peut abattre un voisin (règle 5 du référentiel).
    sources: [R11, S25]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_aucune_commande_de_masse, paramétré sur chaque
      fichier *.service du dépôt, sort vert.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-020
    title: Seuils et table d'entrées en paramètres ROS en lecture seule
    statement: >
      Les seuils et la table d'entrées doivent être des paramètres ROS déclarés
      en lecture seule, chargés d'un YAML.
    rationale: >
      Les seuils vivaient en constantes Python (thresholds.py, S46) : les
      ajuster demandait de modifier le code et de reconstruire. La table
      d'entrées doit être vérifiable par un opérateur sans lire le source.
    sources: [S46, S07]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_safety/test/test_arbitre_parametres.py : publish_rate_hz, stale_s,
      cmd_timeout_s et chaque entrée (topic, priority, timeout_s) sont déclarés
      avec un ParameterDescriptor read_only=True ; le YAML
      clawbot_safety/config/arbitrator.yaml les fournit ; tenter un
      ros2 param set échoue.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P04

  - id: REQ-OPS-030
    title: Aucun pilotage de processus par motif
    statement: >
      Aucun code du dépôt ne doit appeler pkill, killall ou pgrep -f (INV-08).
    rationale: >
      Un motif peut tuer un processus qui n'était pas la cible (S33) ; le contrôle
      de processus passe par systemd, sur liste blanche.
    sources: [S33, INV-08]
    safety: false
    method: test
    level: unit
    criterion: >
      scripts/check.sh, étape « interdits » : grep des motifs sur le dépôt, code de
      sortie non nul si un usage subsiste. Exception nommée :
      joy_teleop/clawbot_restart_teleop.sh, outil manuel hors périmètre P07.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P07

  - id: REQ-OPS-040
    title: Une seule cible de démarrage
    statement: >
      `clawbot.target` doit être le seul point d'entrée du démarrage : elle démarre
      toutes les capacités `always_on` et les nœuds de l'exécutif, et aucune unité du
      robot n'est `WantedBy` d'une cible de démarrage.
    rationale: >
      Deux descriptions concurrentes du démarrage (27 launch files, 14 puis 26 unités)
      rendent l'état de démarrage invérifiable (S23, S25, O11). Une cible unique fait
      de `systemctl status clawbot.target` la réponse à « le robot est-il démarré ? ».
    sources: [S23, S25, O11]
    safety: false
    method: test
    level: unit
    criterion: >
      `clawbot.target` déclare `Wants=` les unités attendues (base, lidar, description,
      localisation, arbitre, capacités, skills, mission, directeur, sentinelle, santé,
      caméra poignet) ; aucune unité du robot ne porte `WantedBy=multi-user.target` ni
      d'autre cible de démarrage ; `systemctl list-dependencies clawbot.target` les
      couvre toutes au déploiement.
    evidence: null
    status: draft
    approved_by: null
    prompt: P14

  - id: REQ-OPS-041
    title: Chaque unité lance un fichier de clawbot_bringup
    statement: >
      Chaque unité du robot doit exécuter `ros2 launch clawbot_bringup <fichier>` ;
      aucune ne doit lancer un nœud par `ros2 run` ni du code par `python3 -c`.
    rationale: >
      `ros2 run` et `python3 -c` disséminent les paramètres dans les fichiers d'unité :
      ils sont invisibles pour un test, non rechargeables, et le YAML lu est celui de
      l'installation. Un fichier de lancement par unité remet les paramètres dans le
      paquet, à côté du code qu'ils configurent.
    sources: [S23, O11]
    safety: false
    method: test
    level: unit
    criterion: >
      Pour chaque fichier de `services/` et `systemd/` décrivant une unité du robot :
      `ExecStart` contient `ros2 launch clawbot_bringup ` et le fichier cité existe dans
      le paquet ; aucune occurrence de `ros2 run` ni de `python3 -c` ; aucun chemin
      `/home/jetson/clawbot/launch/` (paramètres lus par `get_package_share_directory`).
    evidence: null
    status: draft
    approved_by: null
    prompt: P14

  - id: REQ-OPS-042
    title: Les paquets non déployés sortent du build
    statement: >
      Les paquets de didacticiel et les paquets vendor non déployés ne doivent plus être
      construits : ils sont déplacés sous `attic/` avec un fichier `COLCON_IGNORE`.
    rationale: >
      46 paquets pour 15 déployés (S21, R15) : le build complet dure, les doublons
      d'`api_server.py` se multiplient (R10) et une recherche dans le dépôt ramène du
      code qui n'a jamais tourné. `attic/` garde l'historique sans le construire.
    sources: [S21, R15, R10]
    safety: false
    method: test
    level: unit
    criterion: >
      Chaque paquet de la liste de l'inventaire (`docs/ops/inventaire_demarrage.md` §3)
      est sous `attic/` avec `COLCON_IGNORE` ; `colcon list` ne les retourne plus ;
      `scripts/check.sh --strict-duplicates` passe sans exception pour `api_server.py`.
    evidence: null
    status: draft
    approved_by: null
    prompt: P14

  - id: REQ-OPS-043
    title: Une seule API HTTP 8000, branchée sur l'exécutif
    statement: >
      Une seule implémentation de l'API HTTP du port 8000 doit exister ; elle doit
      appeler l'exécutif pour tout mouvement et ne publier sur aucun topic de commande.
    rationale: >
      Trois variantes d'`api_server.py` (R10) et deux chemins de mouvement qui
      contournent l'exécutif : `SetVelocity` écrit `/cmd_vel/teleop` via le service
      matériel, `NavigateTo` navigue à l'estime, `Stop` publie `/cmd_vel` en repli
      (P04). Aucun de ces mouvements n'a de journal, de budget ni de précondition.
    sources: [R10, P04]
    safety: false
    method: test
    level: unit
    criterion: >
      Un seul fichier d'implémentation (`src/api_server.cpp`) ; aucun
      `create_publisher<geometry_msgs::msg::Twist>` dans le paquet ; les routes
      `SetVelocity`, `Stop` et `NavigateTo` appellent l'action `/clawbot/execute_skill`
      (ou `/clawbot/execute_mission`) ; les deux autres `api_server.py` ont disparu.
    evidence: null
    status: draft
    approved_by: null
    prompt: P14

  - id: REQ-OPS-044
    title: L'entrée héritée /cmd_vel quitte l'arbitre
    statement: >
      L'arbitre ne doit plus écouter `/cmd_vel` : l'entrée `legacy` est retirée de sa
      table d'entrées, après vérification qu'aucun éditeur ne subsiste.
    rationale: >
      `/cmd_vel` n'a plus qu'un éditeur de repli (l'API) ; une entrée d'arbitre sans
      producteur est une porte ouverte qu'un futur nœud emprunterait sans passer par la
      table des priorités (P04). Le retrait se fait en deux temps : code de l'API
      d'abord, entrée ensuite, et seulement quand `ros2 topic info` est vide.
    sources: [P04, S25]
    safety: true
    method: test
    level: unit
    criterion: >
      `ENTREES_PAR_DEFAUT` ne contient plus d'entrée `legacy` ni de topic `/cmd_vel` ;
      l'arbitre démarre et publie `/safety/state` avec trois entrées ; au déploiement,
      `ros2 topic info /cmd_vel` annonce zéro éditeur avant et après le retrait.
    evidence: null
    status: draft
    approved_by: null
    prompt: P14

  - id: REQ-OPS-045
    title: Au plus 15 nœuds applicatifs
    statement: >
      En configuration de base, le graphe doit compter au plus 15 nœuds applicatifs.
    rationale: >
      Chaque nœud coûte un processus, un abonnement et une entrée de diagnostic ; O11
      fixe la cible à 15. La mesure du 2026-11-22 donne 23 entrées `ros2 node list`,
      dont 15 applicatifs, 6 d'infrastructure et 3 de rosbridge.
    sources: [O11, P01-M07]
    safety: false
    method: demonstration
    level: hardware
    criterion: >
      Au déploiement : `ros2 node list` filtré des nœuds d'infrastructure
      (`robot_state_publisher`, `joint_state_publisher`, `transform_listener_impl*`,
      `launch_ros_*`) et de rosbridge s'il est conservé, ≤ 15. Mesure consignée dans le
      journal de déploiement P14.
    evidence: deploy/journal/2026-11-22_p14_demarrage.md
    status: draft
    approved_by: null
    prompt: P14
