# Exigences d'exploitation — mesures, unités systemd, arrêts propres, disque.
# Format et règles : requirements/README.md

domain: OPS
requirements:
  - id: REQ-OPS-001
    title: Mesures complémentaires consignées avec commande et artefact
    statement: >
      Les mesures M01 à M12 doivent être consignées avec commande, horodatage et
      artefact.
    rationale: >
      Quatre conclusions de l'audit du 2026-11-22 (trafic image par le Wi-Fi,
      absence de mémoire partagée, arrêt du pilote sur silence, propriétaire du
      port série) ne reposaient pas sur une mesure directe et changeaient la
      suite des travaux (P03, P10, P11, P13, P16).
    sources: [S07, S12, S13, S15, P01]
    safety: false
    method: inspection
    level: unit
    criterion: >
      docs/audit/2026-11-22-complements/rapport.md contient, pour chaque mesure
      M01 à M12, la commande exacte, l'horodatage ISO 8601, le résultat et la
      conclusion ; chaque sortie brute existe dans raw/Mxx_<nom>.txt et commence
      par une date ISO. Une mesure non réalisable porte la mention NON MESURÉ et
      sa raison.
    evidence: docs/audit/2026-11-22-complements/rapport.md
    status: implemented
    approved_by: null
    prompt: P01

  - id: REQ-OPS-010
    title: Politique de redémarrage et d'arrêt normalisée sur toutes les unités
    statement: >
      Chaque unité du robot doit déclarer Restart=on-failure, RestartSec=2,
      StartLimitIntervalSec=60, StartLimitBurst=5 et TimeoutStopSec=10.
    rationale: >
      RestartSec était absent ou très court sur plusieurs unités (100 ms par
      défaut), et Restart=always relançait un arrêt volontaire (R11, S25).
    sources: [R11, S25, S26]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_politique_de_redemarrage_normalisee, paramétré sur
      les 16 unités du robot (14 liées et actives, plus clawbot-description et
      yahboom_oled dont /etc porte encore une copie), sort vert : les cinq clés
      ont exactement la valeur exigée.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-011
    title: Sortie en code 0 sur SIGINT et SIGTERM pour les nœuds maison
    statement: >
      Un nœud maison (director, safety_arbitrator, sentinel, hardware_service)
      qui reçoit SIGINT ou SIGTERM doit sortir en code 0.
    rationale: >
      Un arrêt normal de la sentinelle levait ExternalShutdownException et
      laissait l'unité en failed (R05, S19) ; le directeur et l'arbitre ne
      rattrapaient que KeyboardInterrupt.
    sources: [R05, S19, R11]
    safety: false
    method: test
    level: unit
    criterion: >
      Un test par nœud remplace rclpy.spin (ou uvicorn.run) par une fonction qui
      lève KeyboardInterrupt puis ExternalShutdownException/SystemExit, et vérifie
      que main() renvoie 0. Quatre fichiers de test, deux cas chacun.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-012
    title: Serveur de documentation non exposé au réseau
    statement: >
      Le serveur de documentation ne doit écouter que sur 127.0.0.1.
    rationale: >
      clawbot-docs servait mkdocs sur 0.0.0.0:8080 sans authentification (R16).
    sources: [R16, S25]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_documentation_ecoute_en_local : l'ExecStart de
      clawbot-docs.service contient 127.0.0.1:8080 et ne contient plus 0.0.0.0.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-013
    title: Aucune commande de masse dans les unités
    statement: >
      Aucune commande d'unité ne doit contenir pkill, killall ou pgrep -f.
    rationale: >
      Le contrôle de processus passe par systemd uniquement, sur liste blanche ;
      une unité qui tue par motif peut abattre un voisin (règle 5 du référentiel).
    sources: [R11, S25]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_aucune_commande_de_masse, paramétré sur chaque
      fichier *.service du dépôt, sort vert.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-020
    title: Seuils et table d'entrées en paramètres ROS en lecture seule
    statement: >
      Les seuils et la table d'entrées doivent être des paramètres ROS déclarés
      en lecture seule, chargés d'un YAML.
    rationale: >
      Les seuils vivaient en constantes Python (thresholds.py, S46) : les
      ajuster demandait de modifier le code et de reconstruire. La table
      d'entrées doit être vérifiable par un opérateur sans lire le source.
    sources: [S46, S07]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_safety/test/test_arbitre_parametres.py : publish_rate_hz, stale_s,
      cmd_timeout_s et chaque entrée (topic, priority, timeout_s) sont déclarés
      avec un ParameterDescriptor read_only=True ; le YAML
      clawbot_safety/config/arbitrator.yaml les fournit ; tenter un
      ros2 param set échoue.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P04
