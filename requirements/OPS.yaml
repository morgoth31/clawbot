# Exigences d'exploitation — mesures, unités systemd, arrêts propres, disque.
# Format et règles : requirements/README.md

domain: OPS
requirements:
  - id: REQ-OPS-001
    title: Mesures complémentaires consignées avec commande et artefact
    statement: >
      Les mesures M01 à M12 doivent être consignées avec commande, horodatage et
      artefact.
    rationale: >
      Quatre conclusions de l'audit du 2026-11-22 (trafic image par le Wi-Fi,
      absence de mémoire partagée, arrêt du pilote sur silence, propriétaire du
      port série) ne reposaient pas sur une mesure directe et changeaient la
      suite des travaux (P03, P10, P11, P13, P16).
    sources: [S07, S12, S13, S15, P01]
    safety: false
    method: inspection
    level: unit
    criterion: >
      docs/audit/2026-11-22-complements/rapport.md contient, pour chaque mesure
      M01 à M12, la commande exacte, l'horodatage ISO 8601, le résultat et la
      conclusion ; chaque sortie brute existe dans raw/Mxx_<nom>.txt et commence
      par une date ISO. Une mesure non réalisable porte la mention NON MESURÉ et
      sa raison.
    evidence: docs/audit/2026-11-22-complements/rapport.md
    status: implemented
    approved_by: null
    prompt: P01

  - id: REQ-OPS-010
    title: Politique de redémarrage et d'arrêt normalisée sur toutes les unités
    statement: >
      Chaque unité du robot doit déclarer Restart=on-failure, RestartSec=2,
      StartLimitIntervalSec=60, StartLimitBurst=5 et TimeoutStopSec=10.
    rationale: >
      RestartSec était absent ou très court sur plusieurs unités (100 ms par
      défaut), et Restart=always relançait un arrêt volontaire (R11, S25).
    sources: [R11, S25, S26]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_politique_de_redemarrage_normalisee, paramétré sur
      les 16 unités du robot (14 liées et actives, plus clawbot-description et
      yahboom_oled dont /etc porte encore une copie), sort vert : les cinq clés
      ont exactement la valeur exigée.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-011
    title: Sortie en code 0 sur SIGINT et SIGTERM pour les nœuds maison
    statement: >
      Un nœud maison (director, safety_arbitrator, sentinel, hardware_service)
      qui reçoit SIGINT ou SIGTERM doit sortir en code 0.
    rationale: >
      Un arrêt normal de la sentinelle levait ExternalShutdownException et
      laissait l'unité en failed (R05, S19) ; le directeur et l'arbitre ne
      rattrapaient que KeyboardInterrupt.
    sources: [R05, S19, R11]
    safety: false
    method: test
    level: unit
    criterion: >
      Un test par nœud remplace rclpy.spin (ou uvicorn.run) par une fonction qui
      lève KeyboardInterrupt puis ExternalShutdownException/SystemExit, et vérifie
      que main() renvoie 0. Quatre fichiers de test, deux cas chacun.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-012
    title: Serveur de documentation non exposé au réseau
    statement: >
      Le serveur de documentation ne doit écouter que sur 127.0.0.1.
    rationale: >
      clawbot-docs servait mkdocs sur 0.0.0.0:8080 sans authentification (R16).
    sources: [R16, S25]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_documentation_ecoute_en_local : l'ExecStart de
      clawbot-docs.service contient 127.0.0.1:8080 et ne contient plus 0.0.0.0.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-013
    title: Aucune commande de masse dans les unités
    statement: >
      Aucune commande d'unité ne doit contenir pkill, killall ou pgrep -f.
    rationale: >
      Le contrôle de processus passe par systemd uniquement, sur liste blanche ;
      une unité qui tue par motif peut abattre un voisin (règle 5 du référentiel).
    sources: [R11, S25]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_units.py::test_aucune_commande_de_masse, paramétré sur chaque
      fichier *.service du dépôt, sort vert.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P02

  - id: REQ-OPS-020
    title: Seuils et table d'entrées en paramètres ROS en lecture seule
    statement: >
      Les seuils et la table d'entrées doivent être des paramètres ROS déclarés
      en lecture seule, chargés d'un YAML.
    rationale: >
      Les seuils vivaient en constantes Python (thresholds.py, S46) : les
      ajuster demandait de modifier le code et de reconstruire. La table
      d'entrées doit être vérifiable par un opérateur sans lire le source.
    sources: [S46, S07]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_safety/test/test_arbitre_parametres.py : publish_rate_hz, stale_s,
      cmd_timeout_s et chaque entrée (topic, priority, timeout_s) sont déclarés
      avec un ParameterDescriptor read_only=True ; le YAML
      clawbot_safety/config/arbitrator.yaml les fournit ; tenter un
      ros2 param set échoue.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P04

  - id: REQ-OPS-030
    title: Aucun pilotage de processus par motif
    statement: >
      Aucun code du dépôt ne doit appeler pkill, killall ou pgrep -f (INV-08).
    rationale: >
      Un motif peut tuer un processus qui n'était pas la cible (S33) ; le contrôle
      de processus passe par systemd, sur liste blanche.
    sources: [S33, INV-08]
    safety: false
    method: test
    level: unit
    criterion: >
      scripts/check.sh, étape « interdits » : grep des motifs sur le dépôt, code de
      sortie non nul si un usage subsiste. Exception nommée :
      joy_teleop/clawbot_restart_teleop.sh, outil manuel hors périmètre P07.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P07

  - id: REQ-OPS-050
    title: L'arbre de production est une étiquette figée
    statement: >
      L'arbre /home/jetson/clawbot doit être détaché sur un tag `prod-*` et ne porter
      aucune modification suivie.
    rationale: >
      Les unités de /etc/systemd/system sont des liens vers cet arbre : y changer de
      branche change les fichiers d'unité, donc l'état de démarrage du robot, sans
      qu'aucun contrôle ne le dise (C01, phase A : 4 liens pendants, 21 unités en
      NeedDaemonReload, 2 cibles ExecStart supprimées par P14 alors que les processus
      tournaient encore). Un arbre de production figé sur une étiquette rend l'écart
      entre ce qui tourne et ce qui est écrit visible en une commande.
    sources: [D01, D31, C01]
    safety: false
    method: demonstration
    level: hardware
    criterion: >
      `git -C /home/jetson/clawbot describe --tags --exact-match` renvoie un tag
      `prod-*` ; `git status --porcelain` ne renvoie aucune modification suivie ;
      `smoke_check.sh` affiche « production sur le tag prod-… » et « arbre de
      production sans modification suivie ».
    evidence: deploy/journal/2026-11-22_C01_stabilisation.md
    status: implemented
    approved_by: "opérateur 2026-11-22"
    prompt: C01

  - id: REQ-OPS-051
    title: Aucun lien d'unité pendant, aucune cible absente
    statement: >
      Aucun lien de /etc/systemd/system vers le dépôt ne doit être pendant, et toute
      cible citée par l'ExecStart d'une unité du robot doit exister.
    rationale: >
      Un service peut tourner sur un fichier supprimé et ne pas redémarrer : c'était le
      cas de `ros2-hardware-service` (script `ros2_llm_bridge/hardware_service.py`
      supprimé par P14) et de `clawbot-description`
      (`launch/robot_description.launch.py` rangé sous `attic/`), plus quatre liens
      pendants. Rien ne le signalait avant la panne.
    sources: [C01, D31]
    safety: false
    method: demonstration
    level: hardware
    criterion: >
      `find /etc/systemd/system -maxdepth 1 -xtype l` ne renvoie rien ; pour chaque
      unité du robot, chaque chemin cité par l'ExecStart chargé existe ;
      `smoke_check.sh` affiche « aucun lien d'unité pendant » et « toutes les cibles
      ExecStart existent ».
    evidence: deploy/journal/2026-11-22_C01_stabilisation.md
    status: implemented
    approved_by: "opérateur 2026-11-22"
    prompt: C01

  - id: REQ-OPS-052
    title: Deux arbres, un seul écrivain sur la production
    statement: >
      Tout développement doit se faire dans /home/jetson/clawbot-dev ; l'arbre de
      production ne change que par le skill `clawbot-deploy`.
    rationale: >
      Le même arbre servait aux deux usages : 29 fichiers d'unité écrits par P14 sur
      disque alors que les services tournaient la version d'avant, et 58 suppressions
      non commitées d'origine inconnue dans l'arbre de production. Séparer les arbres
      supprime la classe entière de ces incidents.
    sources: [C01, D01]
    safety: false
    method: inspection
    level: hardware
    criterion: >
      `deploy/README.md` décrit les deux arbres et l'interdiction d'écrire dans la
      production hors déploiement ; `/home/jetson/clawbot-dev` existe comme worktree du
      même dépôt ; la production est détachée sur un tag `prod-*` (REQ-OPS-050).
    evidence: deploy/README.md
    status: implemented
    approved_by: "opérateur 2026-11-22"
    prompt: C01

  - id: REQ-OPS-053
    title: Tout source d'un script d'unite est encadre par set +u / set -u
    statement: >
      Tout script lance par une unite doit encadrer chaque `source` par `set +u` et
      `set -u` lorsqu'il active `set -u`, et l'unite doit atteindre l'etat actif.
    rationale: >
      Les setup.bash de ROS lisent des variables non definies : sous `set -u`,
      clawbot-joy-teleop.service est mort en status=1/FAILURE et a boucle en redemarrage
      le 2026-11-23 a 00:31, sans jamais publier /joy.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      Pour chaque script de joy_teleop/, scripts/ et clawbot_*/*.sh : aucun `source` ne
      suit un `set -u` sans `set +u` interpose. Test : tests/test_scripts_source.py.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05

  - id: REQ-OPS-054
    title: Aucune configuration de manette livree ne declare un axe mort
    statement: >
      La configuration de manette livree avec le depot ne doit declarer aucun axe dont le
      debattement (max - min) est inferieur a 0,5, ni perdre ses boutons.
    rationale: >
      `stick_droit_x` est reste a min = max = 0.0 du 2026-11-15 au 2026-11-23 : le controle
      structurel de manette_config refusait alors le fichier entier, donc le fichier etait
      inchargeable et aucun teleop ne pouvait demarrer.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_manette_config.py : tous les axes ont un debattement >= 0,5, les boutons
      sont presents, et le controle lui-meme sait refuser un axe mort (cas negatif).
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05

  - id: REQ-OPS-055
    title: Les gains de la manette se reglent a chaud et sont bornes
    statement: >
      Le noeud de teleoperation doit appliquer immediatement une modification de
      `linear_scale`, `angular_scale` ou `arm_step`, refuser une valeur hors bornes avec une
      raison, et ne jamais accepter un gain nul ou non fini.
    rationale: >
      Le gain etait lu une seule fois a la construction : `ros2 param set linear_scale 0.20`
      affichait 0.20 pendant que le noeud continuait a 0.06. Le reglage semblait pris et ne
      changeait rien, ce qui fait chercher une panne ailleurs. Une valeur nulle rendrait le
      robot sourd a la manette sans le dire.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_joy_gains.py : gains acceptes dans ]0, MAX] et refuses au-dela avec raison,
      valeurs non finies refusees, et l'appel `add_on_set_parameters_callback` present.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05

  - id: REQ-OPS-056
    title: Stick gauche = deplacement, stick droit = rotation trigonometrique
    statement: >
      En mode vehicule, le stick gauche doit commander la translation (avant/arriere et
      lateral) et le stick droit la rotation : pousse a gauche, il tourne dans le sens
      trigonometrique (z positif) ; pousse a droite, dans le sens horaire (z negatif).
    rationale: >
      L'operateur a demande cette disposition apres essai : translation au pouce gauche,
      rotation au pouce droit. Les deux sticks ayant la meme convention d'axe (X non
      inverse, Y inverse), la permutation est sure et n'exige aucun recalibrage.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_joy_vehicule.py : stick gauche vertical -> x, horizontal -> y (REP-103),
      stick droit -> z avec le bon signe, butees respectees, et le code lit bien les axes
      gauches pour la translation.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05

  - id: REQ-OPS-057
    title: La manette se reconnecte sans redemarrer l'unite
    statement: >
      Apres une perte du peripherique d'entree, `js_joy_source` doit fermer le descripteur,
      attendre le retour de la manette en rescannant `/dev/input/js*` (sans supposer le
      numero), et reprendre la publication de `/joy` sans redemarrage de l'unite.
    rationale: >
      Le noeud sortait en code 1 des que le peripherique ne rendait plus de donnees. Or
      `ros2 launch` survit a la mort d'un de ses noeuds : l'unite restait active sans
      publier `/joy`, et il fallait un `systemctl restart` a la main. La manette s'endort
      regulierement — reconnexions observees a 09:47, 10:14 et 10:21.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_joy_reconnexion.py : selection de l'interface non inertielle, numero de
      peripherique non suppose, et la perte ne termine plus le noeud.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05
