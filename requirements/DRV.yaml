# Exigences du pilote du châssis — source unique, port série nommé, arrêt sur silence.
# Format et règles : requirements/README.md

domain: DRV
requirements:
  - id: REQ-DRV-001
    title: Source unique du pilote dans le dépôt
    statement: >
      Le pilote déployé doit provenir du paquet clawbot_base_driver du dépôt
      clawbot, et aucune autre copie de son code ne doit exister dans ce dépôt.
    rationale: >
      Le pilote existait en deux copies identiques ; l'unité exécutait celle du
      workspace vendor, donc modifier la copie du dépôt n'avait aucun effet
      (R10, S25).
    sources: [R10, S25]
    safety: false
    method: test
    level: unit
    criterion: >
      tests dans clawbot_base_driver/test/ : aucun fichier Mcnamu_driver_X3.py
      dans le dépôt, et l'ExecStart de services/ros2-driver-node.service nomme
      clawbot_base_driver. Au déploiement, check.sh --strict-duplicates ne
      signale plus le pilote et systemctl cat ros2-driver-node cite le paquet.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P03

  - id: REQ-DRV-002
    title: Arrêt moteurs sur silence des consignes
    statement: >
      Le pilote doit commander une vitesse nulle au MCU au plus cmd_timeout_s
      (défaut 0,3 s) après la dernière consigne non nulle reçue, et ne pas
      renvoyer de consigne nulle en boucle ensuite.
    rationale: >
      Le pilote n'avait aucune garde : le MCU conservait la dernière trame reçue
      si l'arbitre cessait de publier (P01-M04). Un arrêt de l'arbitre en plein
      mouvement laissait donc le robot avancer.
    sources: [P01-M04, R05, C08]
    safety: true
    method: test
    level: unit
    criterion: >
      Un test à horloge simulée vérifie un set_car_motion(0, 0, 0) entre 0,30 et
      0,35 s après la dernière consigne non nulle, puis un seul appel nul sur
      2 s de silence. Démonstration complémentaire : tests/hardware/HW-DRV-001.md
      (roues arrêtées en moins de 0,5 s après coupure de la publication).
    evidence: tests/hardware/HW-DRV-001.md
    status: verified
    approved_by: "opérateur 2026-11-22 (cmd_timeout_s=0,3 s ; HW-DRV-001 du 2026-11-22)"
    prompt: P03

  - id: REQ-DRV-003
    title: Port série nommé par un paramètre
    statement: >
      Le chemin du port série doit être le paramètre ROS device_path, par défaut
      le chemin /dev/serial/by-id/... relevé en P01-M05.
    rationale: >
      Le pilote ouvrait le port par le défaut de la bibliothèque (/dev/myserial),
      sans chemin explicite ni trace (Q10, C08).
    sources: [Q10, C08, P01-M05]
    safety: false
    method: test
    level: unit
    criterion: >
      Test de déclaration : device_path vaut par défaut
      /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0 et est transmis à la
      fabrique Rosmaster. Au déploiement : ros2 param get /driver_node
      device_path.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P03

  - id: REQ-DRV-004
    title: Un seul propriétaire du port série
    statement: >
      Un second processus qui tente d'ouvrir le même port doit échouer
      immédiatement avec un message explicite, sans perturber le premier.
    rationale: >
      Le port est exclusif : deux lecteurs se volent les octets sans erreur
      (C08). Le verrou rend la faute visible au lieu de la subir.
    sources: [C08, P01-M05]
    safety: false
    method: test
    level: unit
    criterion: >
      Deux instances du verrou sur un même fichier temporaire : la seconde lève
      PortBusyError dont le message contient le chemin et le PID du détenteur.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P03

  - id: REQ-DRV-005
    title: Interfaces et cadences du pilote inchangées
    statement: >
      Les topics publiés par le pilote, leurs types et leurs cadences doivent
      rester ceux de C12 à -10 % près.
    rationale: >
      Le remplacement de la source ne doit rien changer d'observable pour
      l'arbitre, l'EKF, SLAM et le bras.
    sources: [C12, S25]
    safety: false
    method: demonstration
    level: hardware
    criterion: >
      Au déploiement : /voltage 10 Hz, /imu/data_raw 10 Hz, /odom_raw 10 Hz,
      /vel_raw 10 Hz, /arm/servo_angles 10 Hz (le topic publie à chaque cycle ;
      chaque servo n'est relu qu'une fois par cycle de 6, ~1,7 Hz), /joint_states
      20 Hz (celui de joint_state_publisher), tous à -10 % près, et ros2 node
      list contient /driver_node.
    evidence: deploy/journal/2026-11-22_p03_pilote.md
    status: implemented
    approved_by: null
    prompt: P03

  - id: REQ-DRV-010
    title: Une unite n'existe qu'une fois et le lidar charge son YAML
    statement: >
      Aucune unite ne doit exister a la fois dans `services/` et `systemd/`, et
      `clawbot-lidar.service` doit passer `params_file` avec `config/ydlidar_x3plus.yaml`,
      dont le `frame_id` doit egaler celui que l'ARBRE TF publie.
    rationale: >
      `clawbot-lidar.service` a existe en double : `/etc` pointait sur la variante sans
      `params_file`, le pilote prenait `frame_id: laser` au lieu de `laser_link`, et
      slam_toolbox jetait chaque scan (« queue is full »). Aucune carte n'a ete produite
      pendant le parcours du 2026-11-23.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_unites_uniques.py : aucun doublon entre les deux dossiers, l'unite lidar
      passe params_file, le frame_id declare vaut laser_link, et un doublon serait detecte.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05

  - id: REQ-DRV-011
    title: Une seule source par grandeur dans l'EKF, densite SLAM connue
    statement: >
      Aucune grandeur ne doit etre fusionnee depuis deux sources dans l'EKF ; le taux de
      lacet vient de l'IMU seule, les translations des roues. L'unite SLAM et
      `config/slam_toolbox_mapping.yaml` doivent porter les memes valeurs.
    rationale: >
      `vyaw` etait fusionne depuis `/odom_raw` ET `/imu/data_raw` : deux mesures
      contradictoires, la moins fiable venant des roues d'une base mecanum. Par ailleurs les
      parametres du SLAM vivaient en ligne de commande alors que le YAML dormait sans etre
      charge, avec des valeurs differentes — carte morcelee a 0,2 m de densite de noeuds.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      tests/test_fusion_ekf.py : aucune grandeur en double, vyaw depuis l'IMU seule, vx/vy
      depuis les roues, unite et YAML concordants, densite a 0,1 m.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05

  - id: REQ-DRV-012
    title: Le SLAM exploite les scans a leur cadence et densifie le graphe
    statement: >
      slam_toolbox doit integrer les scans au moins toutes les 0,1 s
      (`minimum_time_interval`), creer un noeud tous les 0,05 m ou 0,05 rad, et elargir la
      recherche du scan matching a 0,8 m (`correlation_search_space_dimension`) pour
      rattraper une erreur de lacet venant de l'odometrie.
    rationale: >
      `minimum_time_interval` valait 0,5 s alors que le lidar publie a 10 Hz : quatre scans
      sur cinq n'entraient jamais dans le graphe, et la pose derivait entre deux mises a
      jour. Carte du 2026-11-23 : dedoublements de murs et eventail de rayons, signatures
      d'une derive de pose pendant le parcours.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      L'unite porte minimum_time_interval 0,1, minimum_travel_distance 0,05,
      minimum_travel_heading 0,05, correlation_search_space_dimension 0,8 ; le YAML dormant
      porte les memes valeurs ; test_fusion_ekf.py refuse toute divergence.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05

  - id: REQ-DRV-013
    title: Le SLAM ignore sa propre structure, l'EKF rejette les vitesses aberrantes
    statement: >
      slam_toolbox doit ignorer les echos plus proches que 0,15 m et au-dela de 8 m, et
      ekf_filter_node doit rejeter une mesure de vitesse de /odom_raw au-dela de 3 ecarts-types.
    rationale: >
      Mesure du 2026-11-23 : le lidar voit sa propre structure jusqu'a 0,039 m (15 points de
      -139 a +108 deg), et la piece ne depasse pas 5,6 m. Aucun seuil Mahalanobis n'etait
      configure : un glissement de roue mecanum etait fusionne tel quel, ce qui dedouble les
      murs dans la carte.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      L'unite porte min_laser_range 0,15 et max_laser_range 8,0 ; ekf.yaml porte
      odom0_twist_rejection_threshold entre 1 et 5.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C05
