# Exigences d'exécution — serveur de skills (P08).
# Format et règles : requirements/README.md.
#
# ÉTAT : bornes validées et exigences SAFETY approuvées par l'opérateur le 2026-11-22.
#   - Bornes retenues : move_relative ≤ 2,0 m et ≤ 0,2 m/s ; rotate ≤ 2π et ≤ 0,8 rad/s
#     (5× et 6× sous les limites du pilote : 1,0 / 1,0 / 5,0).
#   - REQ-EXEC-003 et REQ-EXEC-004 : `approved`, décision citée dans leur note.

domain: EXEC
requirements:
  - id: REQ-EXEC-001
    title: Paramètres refusés avant tout mouvement
    statement: >
      Un goal dont les paramètres ne valident pas le schéma du skill est rejeté
      (outcome REJECTED, code INVALID_PARAMS) sans qu'aucune consigne de vitesse
      ne soit publiée.
    rationale: >
      Les paramètres viennent d'un LLM : bornes et types doivent être vérifiés au
      serveur, pas supposés corrects côté appelant.
    sources: [S05, §7]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_validation_goal.py et
      clawbot_executive/test/test_serveur_skills.py::test_parametres_invalides_rejetes
      (aucune publication sur /cmd_vel/skill).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P08

  - id: REQ-EXEC-002
    title: Capacité inactive bloque avant mouvement
    statement: >
      Un skill dont une capacité requise n'est pas ACTIVE échoue avec
      CAPABILITY_INACTIVE avant toute publication de vitesse.
    rationale: >
      Naviguer sans lidar ni odomètre est une faute de précondition, pas une
      erreur d'exécution : le code d'erreur doit le dire (P07 publie l'état).
    sources: [S05, §3.5]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_exec_preconditions.py::test_capacite_inactive_refuse
      et ::test_capacite_active_autorise.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P08

  - id: REQ-EXEC-003
    title: Vitesses bornées, un seul topic de sortie
    statement: >
      Un skill de déplacement ne publie que sur /cmd_vel/skill, à 20 Hz, avec des
      vitesses bornées par le registre (≤ 0,2 m/s en translation, ≤ 0,8 rad/s en
      rotation) quelle que soit la consigne demandée.
    rationale: >
      INV-01 : seul l'arbitre publie /cmd_vel_safe. Un skill qui dépasserait les
      bornes du registre contournerait la table de priorités de P04.
    sources: [INV-01, §4, §7]
    safety: true
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_controleur_deplacement.py::test_vitesse_saturee
      et ::test_cadence_20_hz ; clawbot_executive/test/test_serveur_skills.py::
      test_aucune_publication_hors_cmd_vel_skill.
    evidence: null
    status: approved
    approved_by: "opérateur 2026-11-22"
    approval_note: >
      APPROUVÉE : bornes validées par l'opérateur le 2026-11-22 : « 0,2 m/s et 0,8 rad/s, 2 m et
      2π, telles que proposées » — 5× et 6× sous les limites du pilote
      (xlinear_limit 1,0, ylinear_limit 1,0, angular_limit 5,0). La variante plus
      prudente (0,1 m/s) a été écartée par l'opérateur.
    prompt: P08

  - id: REQ-EXEC-004
    title: Arrêt immédiat sur hold, capteur périmé ou e-stop
    statement: >
      Pendant un déplacement, si /safety/state indique un maintien, un capteur
      périmé ou l'e-stop verrouillé, le skill publie une consigne nulle et échoue
      avec SAFETY_HOLD, SENSOR_STALE ou ESTOP_LATCHED en moins de 100 ms.
    rationale: >
      L'arbitre coupe la sortie, mais un skill qui continue à publier garde
      l'intention de mouvement : la boucle doit s'arrêter d'elle-même et le
      résultat doit nommer la cause.
    sources: [INV-05, §6.1, O03]
    safety: true
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_controleur_deplacement.py::test_arret_sur_hold,
      ::test_arret_sur_capteur_perime, ::test_arret_sur_estop (horloge simulée,
      mesure du délai) ; tests/integration/test_skills.py en domaine 99.
    evidence: null
    status: approved
    approved_by: "opérateur 2026-11-22"
    approval_note: >
      « REQ-EXEC-004 (consigne nulle et SAFETY_HOLD / SENSOR_STALE / ESTOP_LATCHED en
      moins de 100 ms) est approuvée telle qu'écrite. » Décision de l'opérateur du
      2026-11-22, avec REQ-EXEC-003.
    prompt: P08

  - id: REQ-EXEC-005
    title: Annulation en moins de 200 ms
    statement: >
      Une annulation arrête le skill, publie une consigne nulle et termine en
      CANCELED en moins de 200 ms.
    rationale: >
      Sans annulation, une tâche longue ne peut être interrompue que par l'e-stop.
    sources: [S05]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_serveur_skills.py::test_annulation_arrete_et_consigne_nulle.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P08

  - id: REQ-EXEC-006
    title: Un seul skill à la fois, stop préempte
    statement: >
      Un seul skill s'exécute à la fois ; un nouveau goal est rejeté pendant une
      exécution, sauf stop qui préempte le skill en cours.
    rationale: >
      Deux boucles de vitesse concurrentes se contrediraient ; stop doit toujours
      passer, y compris quand le serveur est occupé.
    sources: [S05, §7]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_serveur_skills.py::test_deuxieme_goal_rejete et
      ::test_stop_preempte.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P08

  - id: REQ-EXEC-007
    title: Précision de déplacement
    statement: >
      move_relative atteint sa cible à ±5 cm et rotate à ±5° en simulation ; sur
      le robot, l'erreur mesurée est consignée dans la procédure matérielle.
    rationale: >
      La précision dépend de l'odométrie de l'EKF et du contrôleur proportionnel :
      elle se mesure, elle ne se suppose pas.
    sources: [§7, C12]
    safety: false
    method: test
    level: integration
    criterion: >
      tests/integration/test_skills.py::test_move_relative_atteint_la_cible et
      ::test_rotate_atteint_l_angle (±5 cm / ±5°) sur clawbot_sim ;
      mesure au sol : tests/hardware/HW-EXEC-001.md.
    evidence: tests/hardware/HW-EXEC-001.md
    status: implemented
    approved_by: null
    prompt: P08

  - id: REQ-EXEC-008
    title: Rapport d'échec conforme
    statement: >
      Tout résultat d'échec contient un failure_report_json valide contre
      failure_report.schema.json.
    rationale: >
      L'exécutif (P09) décide d'un repli à partir de ce rapport : un rapport
      incomplet rend la décision impossible.
    sources: [§6.2]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_rapport_echec.py (validation jsonschema du
      rapport produit pour chaque famille de codes).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P08

  - id: REQ-EXEC-010
    title: Étapes dans l'ordre, événement par transition
    statement: >
      Une mission exécute ses étapes dans l'ordre via /clawbot/execute_skill et publie
      un MissionEvent à chaque transition.
    rationale: >
      L'exécutif remplace la logique d'étapes du directeur (S38) : la seule preuve
      observable est la suite d'événements, pas l'état interne.
    sources: [S38, §3.3, §3.4]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_mission_machine.py::test_etapes_dans_l_ordre et
      ::test_evenement_a_chaque_transition.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-011
    title: Reprise automatique conforme à la table
    statement: >
      Après un échec d'étape, l'exécutif applique exactement la relance automatique de
      §6.1 pour le code reçu : 0 ou 1 relance, avec le délai prévu par la table.
    rationale: >
      La table d'erreurs est la seule autorité sur la relance ; une relance inventée
      par l'exécutif doublerait le temps d'une mission vouée à l'échec.
    sources: [§6.1, R04]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_mission_reprise.py, paramétré sur les 19 codes de
      clawbot_common.errors : nombre de tentatives et délai observés.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-012
    title: Échec persistant, décision attendue, stop exécuté
    statement: >
      Si l'échec persiste après la reprise automatique, la mission passe en
      WAITING_DECISION, le goal se termine FAILED avec le rapport, et un skill stop est
      exécuté.
    rationale: >
      Une mission en échec doit laisser le robot à l'arrêt et rendre la main au LLM avec
      un rapport exploitable.
    sources: [§6.1, §6.4]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_mission_machine.py::test_echec_persistant_attend_decision
      et ::test_stop_execute_apres_echec.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-013
    title: Décision hors table refusée sans budget
    statement: >
      Une décision absente de allowed_decisions est refusée (accepted=false) et ne
      consomme aucun budget.
    rationale: >
      Le LLM ne doit pas pouvoir inventer une décision ; le refus doit être gratuit,
      sinon une erreur de raisonnement épuise les escalades.
    sources: [§6.3]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_mission_machine.py::test_decision_hors_table_refusee
      (budget inchangé) ; parametré sur tous les codes.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-014
    title: Budgets de §6.3 appliqués
    statement: >
      Les budgets de §6.3 (3 escalades, 2 tentatives par étape et paramètres, 600 s
      plafonnées à 1 800 s, décision en 120 s) sont appliqués par l'exécutif ; toute
      valeur de goal supérieure est ramenée au plafond.
    rationale: >
      Un goal ne doit jamais acheter plus de budget que le référentiel n'en accorde.
    sources: [§6.3, INV-07]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_mission_budget.py (4 tests : escalades, tentatives,
      durée, plafonnement des paramètres de goal).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-015
    title: Décision tardive → ABORTED
    statement: >
      Sans décision dans decision_timeout_s, la mission passe ABORTED.
    rationale: >
      Une mission suspendue retient le robot ; sans échéance elle le bloquerait
      indéfiniment.
    sources: [§6.3, §6.4]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_mission_machine.py::test_delai_de_decision_depasse_abandonne.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-016
    title: Journal JSONL par mission
    statement: >
      Chaque événement, rapport et décision (avec rationale) est écrit dans
      /var/lib/clawbot/missions/<date>/<mission_id>.jsonl, une ligne JSON valide par
      entrée, fichier fermé en fin de mission.
    rationale: >
      §6.5 : le journal est la trace exploitable d'une mission, y compris les décisions
      du LLM et leurs justifications.
    sources: [§6.5]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_journal_mission.py (4 tests, dossier temporaire).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-017
    title: Rapport de mission complet
    statement: >
      /clawbot/mission/report renvoie l'état, les étapes, le dernier rapport, les
      décisions et le budget restant.
    rationale: >
      C'est la seule vue dont le LLM dispose pour décider sans relancer une mission.
    sources: [§3.5, §6.2]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_executive/test/test_report_mission.py (3 tests).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09

  - id: REQ-EXEC-018
    title: Façade du directeur, réponses inchangées
    statement: >
      /director/command traduit vers une mission chaque op qui a un équivalent en
      skill, et conserve le traitement actuel pour les autres ; la forme des réponses
      ne change pas.
    rationale: >
      Les trois appelants du directeur ne changent pas dans ce lot (C11) : la façade
      doit être invisible pour eux.
    sources: [C11, S38]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_director/test/test_facade_missions.py, sur le corpus P06 : chaque requête
      produit soit la mission attendue, soit le traitement historique ; forme des
      réponses comparée champ par champ. clawbot_director/test/test_director_schema.py
      reste vert (mode legacy par défaut).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P09
