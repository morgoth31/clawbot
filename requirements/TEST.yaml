# Exigences du cadre de développement et de la suite de tests.
# Format et règles : requirements/README.md

domain: TEST
requirements:
  - id: REQ-TEST-001
    title: Vérification unique verte sur la branche de travail
    statement: >
      scripts/check.sh doit sortir en code 0 sur la branche de travail, sans
      erreur de collecte pytest.
    rationale: >
      Le point d'entrée officiel échoue avant toute exécution (code 2) : deux
      scripts non-pytest sont collectés et le reste de la suite n'est pas
      exécutable d'un seul geste (audit S42).
    sources: [S42, S43]
    safety: false
    method: test
    level: unit
    criterion: >
      scripts/check.sh sort 0 sur cette branche ; le journal ne contient aucune
      ligne « errors during collection ».
    evidence: null
    status: implemented
    approved_by: null
    prompt: P00

  - id: REQ-TEST-002
    title: Garde de domaine DDS dans le script de vérification
    statement: >
      scripts/check.sh doit refuser de s'exécuter si ROS_DOMAIN_ID vaut 28, et
      utiliser 98 si la variable est absente.
    rationale: >
      Le domaine 28 est celui du robot en production ; un test lancé par erreur
      sur ce domaine publie sur les topics du robot (S25).
    sources: [S25, S42]
    safety: false
    method: test
    level: unit
    criterion: >
      ROS_DOMAIN_ID=28 → code de sortie non nul et message explicite contenant
      « 28 » sur stderr ; variable absente → code 0 et affichage
      ROS_DOMAIN_ID=98.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P00

  - id: REQ-TEST-003
    title: Traçabilité exigence ↔ test sans orphelin
    statement: >
      Chaque exigence de méthode test doit être couverte par au moins un test
      marqué req, et chaque marqueur doit viser une exigence existante.
    rationale: >
      Sans contrôle automatique, une exigence peut être déclarée vérifiée sans
      test et un test peut viser un identifiant disparu.
    sources: [S43]
    safety: false
    method: test
    level: unit
    criterion: >
      python3 scripts/trace_check.py --repo . sort 0 : aucune exigence « test »
      sans test, aucun marqueur vers une exigence inconnue.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P00

  - id: REQ-TEST-004
    title: Les scripts manuels ne sont pas collectés par pytest
    statement: >
      Les scripts manuels qui dépendent d'un service réseau ne doivent pas être
      collectés par pytest.
    rationale: >
      tests/test_cpp_bridge.py et tests/test_modes.py appellent
      http://localhost:8002 à l'import ; sans service, la collecte échoue et
      toute la suite sort en code 2 (S42).
    sources: [S42]
    safety: false
    method: test
    level: unit
    criterion: >
      pytest --collect-only -q ne liste aucun fichier de tests/manual/ et sort 0.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P00

  - id: REQ-TEST-005
    title: Cliquet sur les tests non tracés
    statement: >
      Le nombre de tests sans marqueur req ne doit pas augmenter.
    rationale: >
      La majorité des tests existants ne citent aucune exigence ; sans cliquet,
      chaque nouveau prompt peut en ajouter sans que rien ne le signale.
    sources: [S43]
    safety: false
    method: test
    level: unit
    criterion: >
      trace_check.py --max-untraced <valeur de requirements/.untraced_baseline>
      sort 0 ; la valeur inscrite ne peut que diminuer.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P00

  - id: REQ-TEST-010
    title: Construction propre vérifiée
    statement: >
      `scripts/check.sh --build` doit construire tous les paquets du dépôt depuis zéro,
      dans un dossier temporaire, dans un environnement qui ne contient que
      /opt/ros/humble, et sortir en échec si un paquet échoue ou est interrompu.
    rationale: >
      `check.sh` était vert alors que la construction depuis zéro échouait :
      `ros2_llm_bridge_cpp` appelait `find_package(clawbot_interfaces)` sans le déclarer
      dans `package.xml`, et le défaut restait invisible parce que les constructions se
      faisaient avec `install/setup.bash` déjà sourcé (D20). Un contrôle qui ne construit
      pas ne prouve pas que le dépôt se construit.
    sources: [D20, S23]
    safety: false
    method: test
    level: unit
    criterion: >
      `scripts/check.sh --build` lance `colcon build` sous `env -i` avec le seul
      underlay /opt/ros/humble, dans /tmp/clawbot_check_build ; le code de sortie est
      celui de colcon ; un paquet qui `find_package` un autre sans le déclarer fait
      sortir la commande en échec en nommant le paquet manquant.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C02

  - id: REQ-TEST-011
    title: Le lint s'exécute, ou échoue
    statement: >
      L'étape lint doit s'exécuter sur les paquets maison ; si l'outil manque,
      `scripts/check.sh` échoue au lieu d'avertir.
    rationale: >
      Depuis P00, `check.sh` affichait « ruff absent, étape lint ignorée » et sortait 0
      (D10) : le dépôt n'a jamais été linté, et rien ne le disait.
    sources: [D10]
    safety: false
    method: test
    level: unit
    criterion: >
      Avec les paquets maison seuls (`clawbot_*`, `yolo_node`, `tests`, `scripts`,
      `joy_teleop`, jamais `attic/`) : si ni `flake8` ni `ruff` n'est joignable,
      `check.sh --etape lint` sort non nul avec un message explicite ; sinon il publie
      le nombre d'erreurs.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C02

  - id: REQ-TEST-012
    title: Le lint ne se dégrade pas
    statement: >
      Le nombre d'erreurs de lint ne doit pas dépasser `requirements/.lint_baseline`.
    rationale: >
      Corriger 702 erreurs de style n'est pas le sujet ; empêcher d'en ajouter l'est.
      Sans plafond, un outil qu'on active enfin devient un outil qu'on ignore.
    sources: [D10]
    safety: false
    method: test
    level: unit
    criterion: >
      `check.sh --etape lint` sort non nul si le compte dépasse la valeur de
      `requirements/.lint_baseline`, et rappelle que le plafond ne se relève pas.
    evidence: null
    status: implemented
    approved_by: null
    prompt: C02

  - id: REQ-TEST-013
    title: Les cliquets ne remontent pas
    statement: >
      `requirements/.untraced_baseline` et `requirements/.lint_baseline` ne doivent
      jamais être plus élevés que leur valeur sur `main`.
    rationale: >
      `trace_check.py` compare le dépôt au fichier, pas le fichier à son histoire : un
      cliquet relevé reste vert pour toujours. 464 tests sur 635 ne sont pas tracés ; on
      ne sait pas si ce nombre a monté (D14).
    sources: [D14]
    safety: false
    method: test
    level: unit
    criterion: >
      L'étape `cliquets` compare chaque fichier avec `git show main:<fichier>` ; une
      valeur supérieure fait sortir `check.sh` en échec en nommant le fichier. Un fichier
      absent de `main` est accepté (première valeur).
    evidence: null
    status: implemented
    approved_by: null
    prompt: C02

  - id: REQ-TEST-020
    title: Les jeux de reference existent et sont inventories
    statement: >
      Les jeux `slam2d_piece`, `rgbd_statique` et `objets_table` doivent exister dans
      /var/lib/clawbot/test_data/ et leur inventaire (chemin, taille, sha256, duree,
      topics) dans `tests/data_manifest.yaml`.
    rationale: >
      Sans donnees enregistrees sur le robot, SLAM et perception ne se testent qu'en
      presence de l'operateur : chaque essai coute une session et n'est pas reproductible.
    sources: [F00]
    safety: false
    method: test
    level: integration
    criterion: >
      Les trois entrees existent dans `tests/data_manifest.yaml` avec leurs mesures au
      metre ruban ; les fichiers cites existent et leurs sha256 correspondent.
    evidence: tests/data_manifest.yaml
    status: draft
    approved_by: null
    prompt: F00

  - id: REQ-TEST-021
    title: L'inventaire se verifie sur un poste sans donnees
    statement: >
      Un test doit verifier que les fichiers de reference correspondent a l'inventaire, et
      etre ignore avec une raison explicite - et non en echec - si les donnees sont absentes.
    rationale: >
      Les donnees vivent sur le robot (/var/lib/clawbot), pas dans le depot : un poste de
      developpement sans enregistrement doit pouvoir lancer la suite sans rouge trompeur.
    sources: [F00]
    safety: false
    method: test
    level: unit
    criterion: >
      `tests/test_data_manifest.py` verifie presence et sha256 ; si le dossier de donnees
      manque, `pytest.skip("donnees de reference absentes : voir F00")`.
    evidence: null
    status: implemented
    approved_by: null
    prompt: F00
