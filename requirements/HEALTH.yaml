# Exigences de santé des flux — moniteur, péremption, niveau.
# Format et règles : requirements/README.md.

domain: HEALTH
requirements:
  - id: REQ-HEALTH-001
    title: Péremption d'un flux déclaré
    statement: >
      Un flux déclaré dans expected_flows.yaml, critique ou non, dont la capacité
      est active, doit apparaître dans stale_flows de /clawbot/health au plus 3 s
      après son dernier message.
    rationale: >
      Deux flux sont muets sans que rien ne le signale : la profondeur Astra
      (0 message en 12 s, S09) et la détection (aucun éditeur, S07). Les SPOF
      astra_camera et ydlidar n'ont de détection automatique que pour /scan, et
      seulement dans l'arbitre (03 §2).
    sources: [S07, S09, R09, INV-09, O07]
    safety: false
    method: test
    level: integration
    criterion: >
      tests/integration/test_sante.py::test_flux_qui_s_arrete_devient_perime :
      /test_flux publié à 10 Hz puis arrêté, /clawbot/health.stale_flows contient
      /test_flux en moins de 3 s (mesure à l'horloge du test).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P05

  - id: REQ-HEALTH-002
    title: Cadence mesurée sous le seuil
    statement: >
      Un flux dont la cadence mesurée sur 5 s est inférieure à son min_hz doit
      être signalé en WARN, avec la cadence mesurée dans le diagnostic.
    rationale: >
      Un flux qui ralentit (USB saturé, caméra en repli) reste « frais » au sens
      de l'âge alors qu'il ne tient plus sa cadence C12 : l'âge seul ne le voit pas.
    sources: [C12, S08, S09]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_health/test/test_estimateur.cpp (Estimateur.cadence_nominale,
      .cadence_a_moins_20_pour_cent) et test_niveau.cpp (Niveau.flux_lent_seul_donne_warn),
      exécutés par l'étape « cpp » de scripts/check.sh.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P05

  - id: REQ-HEALTH-003
    title: Niveau global de RobotHealth
    statement: >
      RobotHealth.level doit valoir ERROR si un flux critique est périmé, WARN si
      un flux non critique est périmé ou trop lent, OK sinon.
    rationale: >
      Le niveau porte la gravité pour l'humain et pour l'exécutif : confondre un
      flux critique avec un flux de confort ferait ignorer une perte de /scan.
    sources: [INV-09, O07]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_health/test/test_niveau.cpp (Niveau.*) : critique périmé, non critique
      périmé, lent, tout sain, et priorité de ERROR sur WARN dans les deux ordres.
    evidence: null
    status: implemented
    approved_by: null
    prompt: P05

  - id: REQ-HEALTH-004
    title: Aucune désérialisation des flux surveillés
    statement: >
      Le moniteur doit s'abonner à chaque flux en mode brut (raw=True), avec le
      type ROS réel du topic, QoS BEST_EFFORT profondeur 1, sans désérialiser les
      messages. `raw=True` n'exempte pas du type : DDS n'apparie que des types
      identiques. Seule exception :
      un flux dont la valeur est publiée dans RobotHealth (aujourd'hui /voltage)
      reçoit un unique abonnement typé, qui alimente aussi l'estimateur.
    rationale: >
      Surveiller /camera/color/image_raw en désérialisant coûterait la bande
      passante et le CPU d'un second consommateur d'images ; un abonné BEST_EFFORT
      reste compatible avec un éditeur RELIABLE.
    sources: [S09, O03]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_health/test/test_abonnements.cpp (Abonnements.*) : un abonnement par
      topic du manifeste réel, souscription générique pour tous sauf /voltage typé,
      et type ROS réel vérifié (LaserScan, Odometry, Twist, Imu, Image).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P05

  - id: REQ-HEALTH-005
    title: Coût CPU du moniteur
    statement: >
      Le moniteur doit consommer moins de 5 % d'un cœur en régime établi.
    rationale: >
      Un moniteur qui coûte plus que les flux qu'il surveille se ferait
      désactiver : le budget est celui d'une boucle à 1 Hz sur des abonnements
      bruts.
    sources: [O03]
    safety: false
    method: demonstration
    level: hardware
    criterion: >
      Mesure du CPU du processus du moniteur, robot en fonctionnement :
      %CPU < 5 %. Mesures du 2026-11-22 sur le robot : version Python 39,5–43,4 %
      (9 flux) et 15,78 % (sans images) ; version C++ 14,3–15,7 % (9 flux) et
      **2,56 %** (sans images). Exigence NON tenue : il ne reste que le coût de
      recopie des trois flux image. Voir deploy/journal/2026-11-22_p05_sante.md.
    evidence: deploy/journal/2026-11-22_p05_sante.md
    status: implemented
    approved_by: null
    prompt: P05

  - id: REQ-HEALTH-006
    title: Capacité inactive, flux non signalé
    statement: >
      Un flux dont la capacité n'est pas active ne doit pas être signalé, ni
      périmé ni trop lent.
    rationale: >
      Sans cette règle, un bras ou une caméra non montés produiraient des alertes
      permanentes et le niveau resterait WARN en fonctionnement normal.
    sources: [INV-09]
    safety: false
    method: test
    level: unit
    criterion: >
      clawbot_health/test/test_niveau.cpp (Capacites.inactive_ignoree,
      .active_mais_flux_absent_est_perime).
    evidence: null
    status: implemented
    approved_by: null
    prompt: P05
