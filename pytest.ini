[pytest]
; Cadre de test du dépôt Clawbot (P00). Voir requirements/README.md.

; req(id) relie un test à une exigence de requirements/<DOMAINE>.yaml
; (contrôlé par scripts/trace_check.py).
markers =
    req(id): exigence couverte
    hardware: procédure matérielle, jamais automatique
    integration: domaine 99

; Les scripts manuels exigent un service réseau vivant : jamais collectés.
; `attic/` : paquets non deployes (P14), jamais collectes ni construits.
norecursedirs = tests/manual install build log .git .pytest_cache __pycache__ site attic

; Aucune procédure matérielle en exécution automatique.
; Les 21 paquets ROS embarquent chacun un test_flake8.py / test_copyright.py /
; test_pep257.py homonyme : en mode « prepend » ils se confondent et font
; échouer la collecte depuis la racine. Ce sont des enveloppes autour des
; linters ament (plugins désactivés ici) ; le lint du dépôt est fait par ruff.
addopts =
    -m "not hardware"
    --ignore-glob=*/test/test_flake8.py
    --ignore-glob=*/test/test_copyright.py
    --ignore-glob=*/test/test_pep257.py
