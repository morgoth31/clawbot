# Manifeste des capacités (référentiel `docs/architecture/cible.md` §5.1).
#
# Chaque capacité décrit ce qui la rend disponible (`ready_when`), ce dont elle
# dépend (`requires`) et ce qu'elle interdit (`conflicts`). Le gestionnaire ne
# démarre ou n'arrête que des unités listées ici : c'est la liste blanche
# (REQ-CAPA-001). `managed: false` = décrite mais non pilotable à ce stade.
#
# Écarts au §5.1, motivés en P07 :
#   - `mapping` : `clawbot-slam.service` (une unité), pas `ros2 launch slam_launch.py`
#     lancé par le service HTTP : INV-08 interdit le pilotage hors systemd.
#   - `detection` : `yolo-inference.service` est l'unité installée sur ce poste.
#   - `depth_vision` : l'unité est `orbbec-camera.service` (déjà en place, durcie en
#     P11) ; la profondeur est mesurée à 19,4 Hz, `managed: true` depuis P11.
#   - `detection` : `yolo-inference.service` tourne sans publier (/detections a
#     0 éditeur, mesuré le 2026-11-22) ; `managed: false` jusqu'à P12.

capacites:
  base:
    # Decision operateur C04 : la capacite `base` n'a de sens que si l'EKF et l'arbitre
    # tournent (odometrie fusionnee et consigne de vitesse filtree). Le manifeste est
    # aligne sur le referentiel §5.1.
    units: [ros2-driver-node.service, clawbot-ekf.service, clawbot-safety-arbitrator.service]
    always_on: true
    managed: true
    ready_when:
      - {topic: /odom, min_hz: 8.0}
      - {topic: /cmd_vel_safe, min_hz: 18.0}
    timeout_s: 30.0

  lidar:
    units: [clawbot-lidar.service]
    requires: [base]
    always_on: true
    managed: true
    ready_when: [{topic: /scan, min_hz: 9.0}]
    timeout_s: 30.0

  mapping:
    units: [clawbot-slam.service]
    requires: [base, lidar]
    conflicts: [navigation]
    managed: true
    ready_when: [{topic: /map, max_age_s: 30.0}]
    timeout_s: 60.0

  navigation:
    units: [clawbot-nav2.service]
    requires: [base, lidar]
    conflicts: [mapping]
    managed: true
    ready_when: [{action: /navigate_to_pose}]
    timeout_s: 90.0

  arm:
    # Unites reelles : le controleur de trajectoire (actions bras + pince, /arm/joint_states
    # a 20 Hz) et move_group, optionnel, qui ne sert qu'a la planification. Les deux sont
    # demarrees a la demande par le gestionnaire (jamais au boot : ni l'une ni l'autre n'a
    # de lien multi-user.target.wants, et `systemctl is-enabled` rend `linked` code 1).
    units: [clawbot-arm-controller.service, clawbot-move-group.service]
    requires: [base]
    managed: true
    # Les skills du bras passent par MoveIt (decision operateur du 2026-11-22) : la
    # capacite n'est active que si move_group sert /move_action. Le controleur et la
    # pince restent sondes : ce sont eux qui executent reellement.
    ready_when:
      - {action: /move_action}
      - {action: /arm_controller/follow_joint_trajectory}
      - {action: /grip_controller/follow_joint_trajectory}
      - {topic: /arm/joint_states, min_hz: 8.0}
    timeout_s: 45.0

  wrist_vision:
    units: [clawbot-wrist-camera.service]
    requires: [base]
    managed: true
    # 8,0 Hz etait le seuil theorique ; mesure P09/P12 = 6,9 Hz sur USB 2.0 -> 6,0 Hz (mesure - 10 %).
    ready_when: [{topic: /wrist_camera/image_raw, min_hz: 6.0}]
    timeout_s: 30.0

  depth_vision:
    units: [orbbec-camera.service]
    requires: [base]
    always_on: false
    managed: true
    ready_when: [{topic: /camera/depth/image_raw, min_hz: 10.0}]
    timeout_s: 30.0

  detection:
    # `clawbot-yolo.service` : nœud yolo_node (GPU) + façade HTTP 8003 dans le même
    # processus. Pilotable depuis P12 ; l'ancien `yolo-inference.service` est arrêté.
    units: [clawbot-yolo.service]
    requires: [wrist_vision]
    always_on: false
    managed: true
    ready_when: [{topic: /perception/detections, min_hz: 2.0}]
    timeout_s: 30.0

  voice:
    # Decision operateur C04 : capacite conservee mais non pilotable. Aucune unite vocale
    # n'existe sur ce poste ; la sonde documente l'interface attendue si elle est ajoutee.
    # `managed: false` : le gestionnaire ne peut ni la demarrer ni l'arreter.
    units: []
    managed: false
    ready_when: [{topic: /voice/command, min_hz: 0.2}]
    timeout_s: 30.0
