# Fusion odométrique du Clawbot X3 Plus.
# Entrées : /odom_raw (nav_msgs/Odometry produite par le driver à partir des encodeurs)
#           /imu/data_raw (gyro du MCU, nécessaire pour compenser le glissement Mecanum)
# Sortie  : /odom + TF odom -> base_footprint
#
# `base_link_frame` vaut **base_footprint**, pas base_link : l'URDF déclare déjà
# `base_footprint -> base_link` (joint fixe), et deux écrivains du parent de base_link — l'EKF et
# robot_state_publisher — laissent TF avec deux arbres déconnectés. Conséquence mesurée le
# 2026-11-11 : move_group ne joint plus les cadres (`base_footprint` orphelin), pick_ik répond
# `COLLISION_CHECKING_UNAVAILABLE` (-21) même sur la pose courante, et le planificateur ne peut
# rien produire. Avec la chaîne odom -> base_footprint -> base_link, une seule arête par lien et
# `base_link` reste atteignable depuis odom comme avant.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom_raw
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    # l'accélération linéaire n'est PAS fusionnée : son biais s'intègre en mouvement fantôme
    # (mesuré -0,41 m à l'arrêt en deux minutes quand ax était fusionné)
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20
